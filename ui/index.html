<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
    header span { font-size: 0.75rem; opacity: 0.6; margin-left: auto; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }

    .sidebar h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.8px; color: #888; }

    .upload-area {
      border: 2px dashed #c0c0c0;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover { border-color: #4f8ef7; background: #f5f8ff; }
    .upload-area input { display: none; }
    .upload-area p { font-size: 0.82rem; color: #666; margin-top: 6px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4f8ef7; color: #fff; width: 100%; }
    .btn-danger  { background: #ff4d4f; color: #fff; padding: 4px 10px; font-size: 0.78rem; }

    #upload-status { font-size: 0.78rem; min-height: 18px; color: #4f8ef7; }

    .doc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .doc-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f8fa;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.82rem;
      word-break: break-all;
    }
    .doc-list li span { flex: 1; margin-right: 8px; }

    /* ── Chat panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4f8ef7;
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-bottom-left-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: #aaa;
      font-size: 0.78rem;
      border: none;
      padding: 0;
    }

    .typing { display: flex; align-items: center; gap: 4px; padding: 12px 16px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #bbb; animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

    .input-bar {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
    }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 0.92rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      line-height: 1.4;
    }
    #user-input:focus { border-color: #4f8ef7; }

    #send-btn {
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
      height: 42px;
    }
    #send-btn:hover { background: #3a7de0; }
    #send-btn:disabled { background: #b0c8f7; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>🤖 Chat Agent</h1>
  <span>RAG-powered assistant</span>
</header>

<div class="layout">

  <!-- Sidebar: document management -->
  <aside class="sidebar">
    <h2>Knowledge Base</h2>

    <label class="upload-area" id="drop-zone">
      <input type="file" id="file-input" accept=".md" />
      <div style="font-size:1.8rem">📄</div>
      <p>Click or drag a <strong>.md</strong> file here to upload</p>
    </label>

    <button class="btn btn-primary" id="upload-btn">Upload</button>
    <div id="upload-status"></div>

    <h2 style="margin-top:8px">Documents</h2>
    <ul class="doc-list" id="doc-list">
      <li><span style="color:#aaa;font-style:italic">Loading…</span></li>
    </ul>
  </aside>

  <!-- Main chat area -->
  <section class="chat-panel">
    <div id="messages">
      <div class="msg system">Send a message to get started.</div>
    </div>

    <div class="input-bar">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask something…"
        maxlength="4000"
      ></textarea>
      <button id="send-btn">➤</button>
    </div>
  </section>

</div>

<script>
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const fileInput   = document.getElementById("file-input");
  const uploadBtn   = document.getElementById("upload-btn");
  const uploadStatus = document.getElementById("upload-status");
  const docList     = document.getElementById("doc-list");

  let sessionId = "session-" + Math.random().toString(36).slice(2, 10);

  // ── Helpers ──────────────────────────────────────────────────────────────

  function appendMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "msg assistant typing";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // ── Chat ─────────────────────────────────────────────────────────────────

  async function sendMessage() {
    const query = inputEl.value.trim();
    if (!query) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    appendMsg("user", query);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, session_id: sessionId }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendMsg("system", "⚠️ Error " + res.status + ": " + (err.detail || res.statusText));
        return;
      }

      const data = await res.json();
      appendMsg("assistant", data.answer || "(no response)");
    } catch (e) {
      removeTyping();
      appendMsg("system", "⚠️ Network error: " + e.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  // ── Document list ─────────────────────────────────────────────────────────

  async function loadDocs() {
    try {
      const res = await fetch("/list");
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      renderDocs(data.documents || []);
    } catch (e) {
      docList.innerHTML = "<li><span style='color:#f00'>Failed to load</span></li>";
    }
  }

  function renderDocs(docs) {
    if (!docs.length) {
      docList.innerHTML = "<li><span style='color:#aaa;font-style:italic'>No documents yet</span></li>";
      return;
    }
    docList.innerHTML = "";
    docs.forEach((doc) => {
      const li = document.createElement("li");
      const name = doc.filename || doc;
      li.innerHTML = `<span title="${name}">${name}</span>
        <button class="btn btn-danger" data-name="${name}">✕</button>`;
      docList.appendChild(li);
    });
  }

  docList.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-name]");
    if (!btn) return;
    const name = btn.dataset.name;
    if (!confirm(`Delete "${name}"?`)) return;
    btn.disabled = true;
    try {
      const res = await fetch("/delete/" + encodeURIComponent(name), { method: "DELETE" });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
      loadDocs();
    } catch (e) {
      alert("Delete failed: " + e.message);
      btn.disabled = false;
    }
  });

  // ── Upload ────────────────────────────────────────────────────────────────

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) { uploadStatus.textContent = "Please select a file first."; return; }

    const form = new FormData();
    form.append("file", file);

    uploadStatus.textContent = "Uploading…";
    uploadBtn.disabled = true;

    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText);
      uploadStatus.textContent = "✅ " + (data.message || "Uploaded");
      fileInput.value = "";
      loadDocs();
    } catch (e) {
      uploadStatus.textContent = "❌ " + e.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });

  // Drag-and-drop onto the upload zone
  const dropZone = document.getElementById("drop-zone");
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.style.borderColor = "#4f8ef7"; });
  dropZone.addEventListener("dragleave", () => { dropZone.style.borderColor = ""; });
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.style.borderColor = "";
    const dt = e.dataTransfer;
    if (dt.files.length) {
      fileInput.files = dt.files;
    }
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  loadDocs();
</script>
</body>
</html>
