<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="menu-bar">
        <div class="menu-item apple-logo">
            <svg width="14" height="17" viewBox="0 0 14 17" fill="currentColor">
                <path d="M13.3 13.2c-.3.7-.7 1.3-1.1 1.8-.6.8-1.1 1.4-1.4 1.8-.4.5-.8 1-1.2 1.4-.5.5-.9.7-1.3.7s-.8-.2-1.2-.6c-.4-.4-.7-.9-1-1.5-.3-.6-.6-1.3-.8-2.1-.3-.8-.4-1.6-.4-2.5 0-.9.1-1.7.4-2.4.3-.7.6-1.3 1-1.8.4-.5.8-.9 1.3-1.2.5-.3 1-.5 1.5-.5.5 0 1 .2 1.5.5.5.3.9.7 1.3 1.2.4.5.7 1.1 1 1.8.3.7.4 1.5.4 2.4 0 .3 0 .6-.1.9-.1.3-.1.6-.2.8h-2.1c.1-.3.2-.7.2-1.1 0-.5-.1-.9-.3-1.3-.2-.4-.5-.7-.8-.9-.3-.2-.7-.3-1.1-.3-.4 0-.8.1-1.1.3-.3.2-.6.5-.8.9-.2.4-.3.8-.3 1.3 0 .4.1.8.2 1.1h2.1c-.1-.2-.1-.5-.1-.8 0-.9.2-1.7.5-2.4.3-.7.7-1.3 1.2-1.8.5-.5 1.1-.9 1.8-1.1.7-.2 1.4-.3 2.2-.3s1.5.1 2.2.3c.7.2 1.3.6 1.8 1.1.5.5.9 1.1 1.2 1.8.3.7.5 1.5.5 2.4s-.2 1.7-.5 2.4c-.3.7-.7 1.3-1.2 1.8zM10.4 0c0 .5-.2 1-.5 1.5-.3.5-.7.9-1.2 1.3-.5.4-1 .6-1.6.6s-1.1-.2-1.6-.6c-.5-.4-.9-.8-1.2-1.3-.3-.5-.5-1-.5-1.5 0-.5.2-1 .5-1.5.3-.5.7-.9 1.2-1.3.5-.4 1-.6 1.6-.6s1.1.2 1.6.6c.5.4.9.8 1.2 1.3.3.5.5 1 .5 1.5z"/>
            </svg>
        </div>
        <div class="menu-item" style="font-weight: 600;">Chat Agent</div>
        <div class="menu-item">文件</div>
        <div class="menu-item">编辑</div>
        <div class="menu-item">视图</div>
        <div class="menu-item">窗口</div>
        <div class="menu-item">帮助</div>
        <div class="time" id="currentTime"></div>
    </div>

    <div class="desktop">
        <div class="app-icon" onclick="openApp()">
            <div class="app-icon-img">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div class="app-icon-label">Chat Agent</div>
        </div>
    </div>

    <div class="window" id="appWindow">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="traffic-light red" onclick="closeApp()"></div>
                <div class="traffic-light yellow"></div>
                <div class="traffic-light green"></div>
            </div>
            <div class="title">Chat Agent</div>
            <div class="tab-bar" style="position: absolute; right: 16px; left: auto; padding: 0; background: transparent; border: none;">
                <button class="tab-btn active" onclick="switchTab('chat')">聊天</button>
                <button class="tab-btn" onclick="switchTab('knowledge')">知识库</button>
            </div>
        </div>
        
        <div class="chat-container">
            <div id="chat" class="tab-content active">
                <div class="messages" id="messages">
                    <div class="welcome-message" id="welcome">
                        <h1>你好，我是你的 AI 助手</h1>
                        <p>有什么可以帮助你的吗？</p>
                    </div>
                </div>
                
                <div class="typing-indicator" id="typing">
                    <img class="octocat" src="https://github.githubassets.com/images/mona-loading-default.gif" alt="loading">
                    <span class="loading-text">正在思考...</span>
                </div>
                
                <div class="skill-bar">
                    <button class="skill-btn" onclick="insertSkill('/doc')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        知识库
                    </button>
                    <button class="skill-btn" onclick="insertSkill('/search')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                        网页搜索
                    </button>
                </div>
                
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea 
                            id="userInput" 
                            placeholder="输入消息..." 
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                        ></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="knowledge" class="tab-content">
                <div class="kb-header">
                    <div class="kb-title">知识库管理</div>
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        <span id="uploadText">上传 Markdown</span>
                    </button>
                    <input type="file" id="fileInput" accept=".md" onchange="uploadFile(event)">
                </div>
                <div class="kb-list" id="kbList">
                    <div class="kb-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>暂无文档，请上传 Markdown 文件</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dock">
        <div class="dock-icon" onclick="openApp()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <div class="dock-tooltip">Chat Agent</div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        function openApp() {
            document.getElementById('appWindow').classList.add('active');
        }

        function closeApp() {
            document.getElementById('appWindow').classList.remove('active');
        }

        window.openApp = openApp;
        window.closeApp = closeApp;
    </script>
</body>
</html>
